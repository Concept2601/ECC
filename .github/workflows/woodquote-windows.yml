name: En-Quote Windows app

on:
  push:
    paths: ['woodquote/**', '.github/workflows/woodquote-windows.yml']
  pull_request:
    paths: ['woodquote/**', '.github/workflows/woodquote-windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: woodquote
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            woodquote/package-lock.json
            woodquote/desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app
        env:
          # your own licence master key / developer PIN hash (optional, see woodquote/LICENSING.md)
          VITE_WQ_LICENSE_KEY: ${{ secrets.WQ_LICENSE_KEY }}
          VITE_WQ_DEV_PIN_HASH: ${{ secrets.WQ_DEV_PIN_HASH }}
        run: npm run build

      - name: Install desktop shell
        working-directory: woodquote/desktop
        run: npm ci

      - name: Build Windows x64 installer and portable exe
        working-directory: woodquote/desktop
        env:
          # sign the exe when a code-signing certificate is added as a secret
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: En-Quote-Windows-x64
          path: |
            woodquote/desktop/release/*.exe
