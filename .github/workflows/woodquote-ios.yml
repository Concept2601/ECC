name: En-Quote iPhone app

on:
  push:
    paths: ['woodquote/**', '.github/workflows/woodquote-ios.yml']
  pull_request:
    paths: ['woodquote/**', '.github/workflows/woodquote-ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: woodquote
    env:
      # Optional Apple signing secrets. Without them the job still builds and
      # uploads an unsigned .ipa (for sideloading tools such as Sideloadly).
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: woodquote/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app & sync iOS project
        env:
          # your own licence master key / developer PIN hash (optional, see woodquote/LICENSING.md)
          VITE_WQ_LICENSE_KEY: ${{ secrets.WQ_LICENSE_KEY }}
          VITE_WQ_DEV_PIN_HASH: ${{ secrets.WQ_DEV_PIN_HASH }}
        run: npm run ios:sync

      - name: Set build number
        working-directory: woodquote/ios/App
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${GITHUB_RUN_NUMBER};/" App.xcodeproj/project.pbxproj

      - name: Build unsigned app
        working-directory: woodquote/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app out/Payload/
          (cd out && zip -qry En-Quote-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: En-Quote-iOS-unsigned
          path: woodquote/ios/App/out/En-Quote-unsigned.ipa

      - name: Install signing certificate and profile
        if: env.IOS_P12_BASE64 != '' && env.IOS_PROFILE_BASE64 != '' && env.IOS_TEAM_ID != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$GITHUB_RUN_ID" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$GITHUB_RUN_ID" "$KC"
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$GITHUB_RUN_ID" "$KC"
          security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Build signed .ipa
        if: env.PROFILE_NAME != ''
        working-directory: woodquote/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/WoodQuote.xcarchive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>zw.co.zuslyprojects.woodquote</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/WoodQuote.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath out/signed

      - uses: actions/upload-artifact@v4
        if: env.PROFILE_NAME != ''
        with:
          name: En-Quote-iOS-AppStore
          path: woodquote/ios/App/out/signed/*.ipa

      - name: Upload to TestFlight
        if: env.PROFILE_NAME != '' && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != ''
        working-directory: woodquote/ios/App
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -t ios -f out/signed/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
